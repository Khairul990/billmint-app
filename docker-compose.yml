# BillQyro — Phase 2 Local PostgreSQL & Object Storage Stack
# ₹0 Local Development Environment (Disposable & 100% Isolated)

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: billqyro-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billqyro_dev}
      POSTGRES_USER: ${POSTGRES_USER:-billqyro_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secure_password_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - billqyro_pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billqyro_dev_user} -d ${POSTGRES_DB:-billqyro_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO: Cloudflare R2 / S3 Local Emulator for PDF and Attachment Storage
  minio:
    image: minio/minio:latest
    container_name: billqyro-r2-emulator
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - billqyro_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  billqyro_pgdata:
    name: billqyro_pgdata_dev
  billqyro_miniodata:
    name: billqyro_miniodata_dev
