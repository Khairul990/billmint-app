<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillQyro - Invoice Templates Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto:wght@400;500;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0ebe5 0%, #f5f3ef 50%, #fefdf9 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
        }

        .controls label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .controls select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: white;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .controls select:hover {
            border-color: #B8860B;
        }

        .controls select:focus {
            outline: none;
            border-color: #B8860B;
            box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1);
        }

        .controls button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #B8860B, #DAA520);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(184, 134, 11, 0.3);
        }

        .preview-area {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            padding: 50px;
            min-height: 900px;
            position: relative;
        }

        /* ==================== UNIVERSAL IMPROVEMENTS ==================== */

        .stat-card {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.08), rgba(218, 165, 32, 0.05));
            border: 1px solid rgba(184, 134, 11, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 30px 0 !important;
        }

        table thead tr {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.08), rgba(218, 165, 32, 0.05));
            border-bottom: 2px solid #d4af37;
        }

        table th {
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 14px 12px;
            text-align: left;
            font-size: 11px;
        }

        table td {
            padding: 14px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        table tbody tr:hover {
            background: rgba(184, 134, 11, 0.03);
        }

        table tbody tr:nth-child(even) {
            background: rgba(250, 250, 250, 0.6);
        }

        .section-title {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #555;
        }

        .info-text {
            font-size: 13px;
            line-height: 1.8;
            color: #333;
        }

        .grand-total {
            font-weight: 800;
            font-size: 18px;
            padding: 18px 20px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.15), rgba(218, 165, 32, 0.08));
            border: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.15);
            margin-top: 15px;
        }

        .total-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #e8e8e8;
            font-size: 13px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .controls {
                display: none;
            }
            .preview-area {
                box-shadow: none;
                padding: 0;
                width: 210mm;
                height: 297mm;
            }
        }

        /* ==================== TEMPLATE 1: MINIMAL CLASSIC ==================== */
        .template-1 .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 3px solid #1a1a1a;
            position: relative;
        }

        .template-1 .header::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #B8860B, transparent);
            border-radius: 2px;
        }

        .template-1 .invoice-title {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #1a1a1a;
        }

        .template-1 .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 40px;
            padding: 25px 0;
        }

        .template-1 .signature-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-top: 50px;
        }

        .template-1 .signature-line {
            border-top: 2px solid #1a1a1a;
            padding-top: 12px;
            margin-top: 70px;
            font-size: 11px;
        }

        /* ==================== TEMPLATE 2: SAGE GREEN CURVED ==================== */
        .template-2 .header {
            background: linear-gradient(135deg, #6B8E23 0%, #7FA024 50%, #8FBC8F 100%);
            color: white;
            padding: 50px 40px;
            border-radius: 0 0 60px 60px;
            margin: -50px -50px 50px -50px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(107, 142, 35, 0.25);
        }

        .template-2 .invoice-title {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .template-2 .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 40px;
            padding: 25px 0;
        }

        .template-2 .section-title {
            color: #6B8E23;
        }

        .template-2 table thead tr {
            background: linear-gradient(135deg, #E8F5E9, #F1F8E9);
            border-bottom: 3px solid #6B8E23;
        }

        .template-2 table th {
            color: #6B8E23;
        }

        .template-2 .grand-total {
            background: linear-gradient(135deg, #6B8E23, #8FBC8F);
            color: white;
            border: none;
            box-shadow: 0 8px 25px rgba(107, 142, 35, 0.3);
        }

        .template-2 .signature-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-top: 50px;
            padding-top: 25px;
        }

        .template-2 .signature-line {
            border-top: 2px solid #6B8E23;
            padding-top: 12px;
            margin-top: 70px;
        }

        /* ==================== TEMPLATE 3: TEAL BOLD HEADER ==================== */
        .template-3 .header {
            background: linear-gradient(135deg, #008B8B 0%, #20B2AA 100%);
            color: white;
            padding: 50px;
            margin: -50px -50px 50px -50px;
            text-align: left;
            box-shadow: 0 8px 30px rgba(0, 139, 139, 0.25);
        }

        .template-3 .invoice-title {
            font-size: 62px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .template-3 .invoice-id {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.95;
        }

        .template-3 .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 40px;
            padding: 25px 0;
        }

        .template-3 table thead tr {
            background: linear-gradient(135deg, #008B8B, #20B2AA);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 139, 139, 0.2);
        }

        .template-3 table th {
            padding: 16px 12px;
            color: white;
        }

        .template-3 .grand-total {
            background: linear-gradient(135deg, #008B8B, #20B2AA);
            color: white;
            border: none;
            box-shadow: 0 8px 25px rgba(0, 139, 139, 0.3);
        }

        /* ==================== TEMPLATE 4: PURPLE CORPORATE ==================== */
        .template-4 .header {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 25px;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 3px solid #6A5ACD;
            position: relative;
        }

        .template-4 .header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6A5ACD, transparent);
        }

        .template-4 .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6A5ACD, #7B68EE);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(106, 90, 205, 0.25);
        }

        .template-4 .header-right {
            text-align: right;
        }

        .template-4 .invoice-title {
            font-size: 48px;
            font-weight: 800;
            color: #6A5ACD;
            letter-spacing: 2px;
        }

        .template-4 table thead tr {
            background: linear-gradient(135deg, #6A5ACD, #7B68EE);
            color: white;
            box-shadow: 0 4px 12px rgba(106, 90, 205, 0.2);
        }

        .template-4 table th {
            padding: 16px 12px;
            color: white;
        }

        .template-4 .grand-total {
            background: linear-gradient(135deg, #6A5ACD, #7B68EE);
            color: white;
            border: none;
            box-shadow: 0 8px 25px rgba(106, 90, 205, 0.3);
        }

        /* ==================== TEMPLATE 5: ORANGE GRADIENT MODERN ==================== */
        .template-5 .invoice-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FF8C00, #FFA500);
            color: white;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.35);
            letter-spacing: 2px;
        }

        .template-5 .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 40px;
        }

        .template-5 table thead tr {
            background: linear-gradient(135deg, #FF8C00, #FFA500);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.25);
        }

        .template-5 table th {
            padding: 16px 12px;
            color: white;
        }

        .template-5 .grand-total {
            background: linear-gradient(135deg, #FF8C00, #FFA500);
            color: white;
            border: none;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.35);
        }

        /* ==================== TEMPLATE 6: ORANGE GEOMETRIC CORNER ==================== */
        .template-6 {
            position: relative;
        }

        .template-6 .preview-area::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #FF8C00, #FFA500);
            clip-path: polygon(100% 0, 0 0, 100% 100%);
            z-index: 0;
            opacity: 0.95;
            box-shadow: -5px 5px 20px rgba(255, 140, 0, 0.2);
        }

        .template-6 .header {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px solid #FF8C00;
        }

        .template-6 .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: #FF8C00;
            font-style: italic;
            letter-spacing: 1px;
        }

        .template-6 .invoice-title {
            text-align: right;
            font-size: 56px;
            font-weight: 700;
            color: #FF8C00;
            letter-spacing: 3px;
        }

        .template-6 table thead tr {
            border-bottom: 3px solid #FF8C00;
            background: transparent;
        }

        .template-6 table th {
            padding: 14px 12px;
            color: #FF8C00;
        }

        .template-6 .grand-total {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.15), rgba(255, 165, 0, 0.08));
            color: #FF8C00;
            border-left: 5px solid #FF8C00;
            box-shadow: inset 0 0 20px rgba(255, 140, 0, 0.1);
        }

        /* ==================== TEMPLATE 7: BLACK & ORANGE BOLD ==================== */
        .template-7 .preview-area {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            color: white;
        }

        .template-7 .header {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 25px;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 3px solid #FF8C00;
            position: relative;
        }

        .template-7 .header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FF8C00, transparent);
        }

        .template-7 .logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #FF8C00, #FFA500);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 800;
            color: white;
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.3);
        }

        .template-7 .invoice-title {
            font-size: 52px;
            font-weight: 800;
            color: #FF8C00;
            letter-spacing: 2px;
        }

        .template-7 .info-text {
            color: #ddd;
        }

        .template-7 table thead tr {
            background: linear-gradient(135deg, #FF8C00, #FFA500);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
        }

        .template-7 table th {
            padding: 16px 12px;
            color: white;
        }

        .template-7 table td {
            color: #ddd;
        }

        .template-7 .grand-total {
            background: linear-gradient(135deg, #FF8C00, #FFA500);
            color: white;
            border: none;
            box-shadow: 0 8px 30px rgba(255, 140, 0, 0.4);
        }

        /* ==================== TEMPLATE 8: LUXURY GOLD & BLACK ==================== */
        .template-8 .preview-area {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            color: white;
            position: relative;
        }

        .template-8 .preview-area::before {
            content: '';
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            border: 3px solid #D4AF37;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0.6;
        }

        .template-8 .preview-area::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-top: 3px solid #D4AF37;
            border-left: 3px solid #D4AF37;
            border-radius: 2px;
            pointer-events: none;
        }

        .template-8 .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px solid #D4AF37;
            position: relative;
            z-index: 1;
        }

        .template-8 .logo {
            display: inline-flex;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #D4AF37, #E6C200);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
        }

        .template-8 .invoice-title {
            font-size: 56px;
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .template-8 .info-text {
            color: #ccc;
        }

        .template-8 table thead tr {
            border-top: 2px solid #D4AF37;
            border-bottom: 2px solid #D4AF37;
            background: transparent;
        }

        .template-8 table th {
            padding: 16px 12px;
            color: #D4AF37;
        }

        .template-8 table td {
            color: #ddd;
        }

        .template-8 .grand-total {
            background: linear-gradient(135deg, #D4AF37, #E6C200);
            color: #1a1a1a;
            border: none;
            box-shadow: 0 10px 35px rgba(212, 175, 55, 0.4);
        }

        /* ==================== TEMPLATE 9: BLACK HEADER PROFESSIONAL ==================== */
        .template-9 .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            color: white;
            padding: 35px;
            margin: -50px -50px 50px -50px;
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 25px;
            align-items: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .template-9 .logo {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            font-weight: 800;
            font-size: 24px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .template-9 .header-info h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .template-9 .header-info p {
            font-size: 12px;
            color: #bbb;
            letter-spacing: 0.5px;
        }

        .template-9 table thead tr {
            border-bottom: 3px dashed #1a1a1a;
            background: transparent;
        }

        .template-9 table th {
            padding: 14px 12px;
            color: #1a1a1a;
        }

        .template-9 .grand-total {
            background: linear-gradient(135deg, #f5f5f5, #f0f0f0);
            color: #1a1a1a;
            border: 2px solid #1a1a1a;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        /* ==================== TEMPLATE 10: BLUE ROUNDED MODERN ==================== */
        .template-10 .preview-area {
            background: linear-gradient(135deg, #1e90ff, #4169e1, #1e90ff);
            background-size: 400% 400%;
            padding: 50px;
            border-radius: 25px;
            color: white;
            position: relative;
        }

        .template-10 .preview-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.08) 0%, transparent 50%);
            border-radius: 25px;
            pointer-events: none;
        }

        .template-10 .card {
            background: white;
            color: #333;
            padding: 45px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 15px 40px rgba(30, 144, 255, 0.25);
            position: relative;
            z-index: 1;
        }

        .template-10 .invoice-title {
            font-size: 48px;
            font-weight: 800;
            color: #1e90ff;
            margin-bottom: 30px;
        }

        .template-10 table thead tr {
            background: linear-gradient(135deg, #1e90ff, #4169e1);
            color: white;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(30, 144, 255, 0.25);
        }

        .template-10 table th {
            padding: 16px 12px;
            color: white;
        }

        .template-10 .grand-total {
            background: linear-gradient(135deg, #1e90ff, #4169e1);
            color: white;
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 30px rgba(30, 144, 255, 0.35);
        }

        /* ==================== TEMPLATE 11: RED CORPORATE CLEAN ==================== */
        .template-11 .header {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            align-items: flex-start;
        }

        .template-11 .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #DC143C, #FF1744);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(220, 20, 60, 0.3);
        }

        .template-11 .invoice-title {
            font-size: 44px;
            font-weight: 800;
            color: #DC143C;
            letter-spacing: 2px;
        }

        .template-11 table thead tr {
            background: linear-gradient(135deg, #DC143C, #FF1744);
            color: white;
            box-shadow: 0 6px 15px rgba(220, 20, 60, 0.25);
        }

        .template-11 table th {
            padding: 16px 12px;
            color: white;
        }

        .template-11 table tbody tr:nth-child(even) {
            background: rgba(220, 20, 60, 0.03);
        }

        .template-11 .grand-total {
            background: linear-gradient(135deg, #DC143C, #FF1744);
            color: white;
            border: none;
            box-shadow: 0 8px 25px rgba(220, 20, 60, 0.3);
        }

        /* ==================== TEMPLATE 12: CLEAN TWO-COLUMN MODERN ==================== */
        .template-12 .header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 50px;
            align-items: flex-start;
        }

        .template-12 .invoice-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(250,250,250,0.8));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 25px;
            border-radius: 12px;
            text-align: right;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
