<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="foldGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="curlGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    
    <!-- Premium drop shadow filter for card depth -->
    <filter id="cardShadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Shadow filter for the invoice sheet on B spine -->
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. PREMIUM APPS CARD BACKGROUND WITH DROP SHADOW -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#ffffff" filter="url(#cardShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#f1f5f9" stroke-width="2" />

  <!-- 2. SCALED LOGO MARK (Centered in the upper card area) -->
  <g transform="translate(136, 56) scale(2.4)">
    <!-- Stylized Navy "B" (Back layer) -->
    <path 
      fill-rule="evenodd" 
      clip-rule="evenodd"
      d="M32 16h18c12 0 19 5.5 19 14.5c0 5-3.5 9-9.5 11c6.5 1.5 10.5 5.5 10.5 12.5c0 11-8.5 16-20 16H32c-2.2 0-4-1.8-4-4V20c0-2.2 1.8-4 4-4zm6.5 7.5v12.5h11.5c4 0 7-2 7-6.25s-3-6.25-7-6.25H38.5zm0 18.5V57h13.5c5.5 0 8.5-2.5 8.5-7s-3-7.5-8.5-7.5H38.5z"
      fill="#0f172a"
    />

    <!-- Premium Invoicing Document Sheet (Front layer) with shadow -->
    <path 
      d="M24 28c0-4.4 3.6-8 8-8h16l8 8v34c0 4.4-3.6 8-8 8H32c-4.4 0-8-3.6-8-8V28z" 
      fill="url(#brandGradient)"
      filter="url(#sheetShadow)"
    />

    <!-- Three premium horizontal invoice lines -->
    <rect x="30" y="30" width="12" height="2" rx="1" fill="#064E3B" fill-opacity="0.45" />
    <rect x="30" y="36" width="18" height="2" rx="1" fill="#064E3B" fill-opacity="0.45" />
    <rect x="30" y="42" width="10" height="2" rx="1" fill="#064E3B" fill-opacity="0.45" />

    <!-- Bold Dollar $ Symbol in bottom center -->
    <path 
      d="M38 48.5c0-.6.4-1 1-1h1.5v-1c0-.3.2-.5.5-.5h1c.3 0 .5.2.5.5v1H44c.6 0 1 .4 1 1s-.4 1-1 1h-2.5v1.5h1.5c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5V59c0 .3-.2.5-.5.5h-1c-.3 0-.5-.2-.5-.5v-1H39c-.6 0-1-.4-1-1s.4-1 1-1h2.5v-1.5h-1.5c-1.4 0-2.5-1.1-2.5-2.5zm4 1.5c.3 0 .5-.2.5-.5s-.2-.5-.5-.5h-1.5c-.3 0-.5.2-.5.5s.2.5.5.5H42zm.5 5.5c-.3 0-.5.2-.5.5s.2.5.5.5H44c.3 0 .5-.2.5-.5s-.2-.5-.5-.5h-1.5z" 
      fill="#064E3B"
      fill-opacity="0.85"
    />

    <!-- Top-Right Paper Fold corner -->
    <path 
      d="M48 20l8 8h-6c-1.1 0-2-.9-2-2v-6z" 
      fill="url(#foldGradient)"
    />

    <!-- Bottom-Right Curved Roll Curl -->
    <path 
      d="M50 70c6 0 6-6 6-6H48c-1.1 0-2 .9-2 2v2c2 2 4 2 4 2z" 
      fill="url(#curlGradient)"
    />
  </g>

  <!-- 3. BRAND TYPOGRAPHY -->
  <text 
    x="256" 
    y="384" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="46" 
    font-weight="900" 
    fill="#0f172a" 
    text-anchor="middle"
    letter-spacing="-1px"
  >Bill<tspan fill="#10b981">Mınt</tspan></text>

  <!-- Custom Vector Mint Leaf dot placed precisely above the dotless 'ı' -->
  <g transform="translate(295.5, 344) scale(2.3)">
    <path d="M0,7 C1,3 4,1 6,0 C6,2 5,5 3,6 C2,7 0,7 0,7 Z" fill="#34d399" />
  </g>

  <!-- Tagline subtitle -->
  <text 
    x="256" 
    y="416" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="12" 
    font-weight="900" 
    fill="#94a3b8" 
    text-anchor="middle"
    letter-spacing="3.5px"
  >MODERN BILLING &amp; INVOICING PLATFORM</text>
</svg>
