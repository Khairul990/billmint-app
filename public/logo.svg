<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" fill="none" width="100%" height="100%">
  <style>
    :root {
      --text-bill: #0f172a;
      --text-qyro: #10b981;
      --text-tagline: #94a3b8;
      --paper-fill: #ffffff;
      --paper-stroke: rgba(226, 232, 240, 0.5);
      --lines-fill: #059669;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-bill: #ffffff;
        --text-qyro: #34d399;
        --text-tagline: #64748b;
        --paper-fill: #0f172a;
        --paper-stroke: #1e293b;
        --lines-fill: #34d399;
      }
    }
    .text-bill { fill: var(--text-bill); transition: fill 0.3s; }
    .text-qyro { fill: var(--text-qyro); transition: fill 0.3s; }
    .text-tagline { fill: var(--text-tagline); transition: fill 0.3s; }
    .paper-fill { fill: var(--paper-fill); stroke: var(--paper-stroke); transition: fill 0.3s, stroke 0.3s; }
    .lines-fill { fill: var(--lines-fill); transition: fill 0.3s; }
  </style>
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="foldGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- 1. BRAND ICON -->
  <g transform="translate(10, 8) scale(0.44)">
    <!-- Stylized Ribbon "B" in Emerald/Teal Gradient -->
    <path 
      fill-rule="evenodd" 
      clip-rule="evenodd"
      d="M32 15C24 15 24 23 24 30V70C24 77 24 85 32 85H60C72 85 82 77 82 66C82 58 76 51 68 49C76 47 80 40 80 32C80 22 72 15 60 15Z"
      fill="url(#brandGradient)"
    />

    <!-- Premium Invoicing Document Sheet -->
    <path 
      d="M36 22H52L60 30V60C60 64.4 56.4 68 52 68H42C34 68 30 72 27 76C26 71 28 64 32 60V26C32 23.8 33.8 22 36 22Z" 
      class="paper-fill"
      stroke-width="1"
    />

    <!-- Folded paper corner -->
    <path 
      d="M52 22V28C52 29.1 52.9 30 54 30H60L52 22Z" 
      fill="url(#foldGradient)"
    />

    <!-- Three premium horizontal invoice lines -->
    <rect x="38" y="32" width="12" height="2" rx="1" class="lines-fill" />
    <rect x="38" y="38" width="16" height="2" rx="1" class="lines-fill" />
    <rect x="38" y="44" width="10" height="2" rx="1" class="lines-fill" />

    <!-- Bold Dollar $ Symbol in bottom center -->
    <path 
      d="M41 50.5c0-.4.3-.8.8-.8h1.2v-.7c0-.2.2-.4.4-.4h.8c.2 0 .4.2.4.4v.7h1.2c.4 0 .8.4.8.8s-.4.8-.8.8h-2v1h1.5c1 0 1.8.8 1.8 1.8s-.8 1.8-1.8 1.8V57c0 .2-.2.4-.4.4h-.8c-.2 0-.4-.2-.4-.4v-.7H41c-.4 0-.8-.4-.8-.8s.4-.8.8-.8h2v-1H41.5c-1 0-1.8-.8-1.8-1.8zm3 1c.2 0 .3-.1.3-.3s-.1-.3-.3-.3h-1.2c-.2 0-.3.1-.3.3s.1.3.3.3H44zm.3 4c-.2 0-.3.1-.3.3s.1.3.3.3h1.2c.2 0 .3-.1.3-.3s-.1-.3-.3-.3h-1.2z" 
      class="lines-fill"
    />
  </g>

  <!-- 2. BRAND TYPOGRAPHY -->
  <text 
    x="62" 
    y="33" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="22" 
    font-weight="900" 
    class="text-bill" 
    letter-spacing="-0.5px"
  >Bill<tspan class="text-qyro">Qyro</tspan></text>

  <!-- Custom Vector Accent Leaf dot placed precisely after the 'o' -->
  <g transform="translate(150, 15.5) scale(1.1)">
    <path d="M0,7 C1,3 4,1 6,0 C6,2 5,5 3,6 C2,7 0,7 0,7 Z" class="text-qyro" />
  </g>

  <!-- 3. BRAND TAGLINE -->
  <text 
    x="62" 
    y="47" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="5.2" 
    font-weight="900" 
    class="text-tagline" 
    letter-spacing="1.2px"
  >MODERN BILLING &amp; INVOICING PLATFORM</text>
  
  <!-- Left/Right Accent Line Markers -->
  <line x1="62" y1="52" x2="72" y2="52" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
  <line x1="202" y1="52" x2="212" y2="52" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
</svg>
