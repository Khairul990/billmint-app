<svg viewBox="0 0 100 100" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#00d2ff" />
      <stop offset="50%" stopColor="#059669" />
      <stop offset="100%" stopColor="#0f766e" />
    </linearGradient>
    <linearGradient id="foldGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stopColor="#cbd5e1" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2" />
    </filter>
  </defs>

  <g transform="translate(5, 5) scale(0.9)">
    <!-- 1. The Teal Q Ring (Back layer) -->
    <circle cx="45" cy="45" r="32" fill="none" stroke="url(#brandGradient)" stroke-width="18" filter="url(#shadow1)" />

    <!-- 2. Premium White Invoicing Document Sheet (Middle layer) -->
    <path d="M30 15 H55 L70 30 V70 C70 73 67 76 64 76 H30 C27 76 24 73 24 70 V21 C24 18 27 15 30 15 Z" fill="#ffffff" filter="url(#shadow1)" />

    <!-- Folded paper corner -->
    <path d="M55 15 V30 H70 Z" fill="url(#foldGradient)" />

    <!-- Three premium horizontal invoice lines -->
    <rect x="35" y="32" width="22" height="4" rx="2" fill="#0d9488" />
    <rect x="35" y="42" width="26" height="4" rx="2" fill="#0d9488" />
    <rect x="35" y="52" width="14" height="4" rx="2" fill="#0d9488" />

    <!-- Bold Rupee ₹ Symbol in bottom center -->
    <path transform="translate(39, 56) scale(0.6)" d="M19.5,14 H10 V11 H13.5 C15.5,11 17,10 17,8 C17,6.5 15.5,5.5 13.5,5.5 H10 V3 H20 V0 H6 V3 H10 C12,3 13,4 13,5.5 C13,7 12,8 10,8 H6 V11 H10 V14 H6 V17 H10.5 L19.5,28 H24 L14.5,17 H19.5 V14 Z" fill="#0d9488" />

    <!-- 3. The Teal Q Tail (Front layer) -->
    <path d="M 50 50 L 78 80 C 80 82 78 85 75 85 L 62 85 C 60 85 58 84 56 82 L 36 60 Z" fill="url(#brandGradient)" filter="url(#shadow1)" />
  </g>
</svg>
