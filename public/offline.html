<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | BillQyro Billing</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 32px 24px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.1);
      color: #0d9488;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
      color: #0f172a;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .button {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      transition: opacity 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.2);
    }
    .button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84M8.5 16a4.5 4.5 0 0 1 7 0M12 20h.01"/>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>BillQyro has loaded your local billing database safely. You can still create invoices, search client databases, and manage catalog items local-first!</p>
    <a href="/" class="button">Go to Dashboard</a>
  </div>
</body>
</html>
