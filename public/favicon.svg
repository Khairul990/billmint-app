<svg viewBox="0 0 100 100" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#00d2ff" />
      <stop offset="50%" stopColor="#059669" />
      <stop offset="100%" stopColor="#0f766e" />
    </linearGradient>
    <linearGradient id="foldGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stopColor="#cbd5e1" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Solid Circle Background -->
  <circle cx="50" cy="50" r="42" fill="url(#brandGradient)" filter="url(#shadow1)" />

  <!-- Document -->
  <path d="M34 20 H58 L72 34 V76 C72 79 69 82 66 82 H34 C31 82 28 79 28 76 V26 C28 23 31 20 34 20 Z" fill="#ffffff" filter="url(#shadow1)" />
  
  <!-- Fold -->
  <path d="M58 20 V34 H72 Z" fill="url(#foldGradient)" />

  <!-- Lines -->
  <rect x="38" y="36" width="24" height="4" rx="2" fill="#0d9488" />
  <rect x="38" y="46" width="24" height="4" rx="2" fill="#0d9488" />
  <rect x="38" y="56" width="24" height="4" rx="2" fill="#0d9488" />
  <rect x="38" y="66" width="16" height="4" rx="2" fill="#0d9488" />

  <!-- Q Tail -->
  <g transform="translate(52, 52) rotate(-45)">
    <rect x="-8" y="-5" width="18" height="48" rx="6" fill="url(#brandGradient)" filter="url(#shadow1)" />
  </g>
</svg>
