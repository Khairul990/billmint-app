<svg viewBox="0 0 100 100" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#00d2ff" />
      <stop offset="50%" stopColor="#059669" />
      <stop offset="100%" stopColor="#0f766e" />
    </linearGradient>
    <linearGradient id="foldGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stopColor="#cbd5e1" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Thick Teal Ring (Q body) -->
  <circle cx="45" cy="45" r="32" fill="none" stroke="url(#brandGradient)" strokeWidth="16" filter="url(#shadow1)" />

  <!-- Document -->
  <path d="M 28 15 H 52 L 68 31 V 70 C 68 74 65 77 61 77 H 28 C 24 77 21 74 21 70 V 22 C 21 18 24 15 28 15 Z" fill="#ffffff" filter="url(#shadow1)" />
  
  <!-- Fold -->
  <path d="M 52 15 V 31 H 68 Z" fill="url(#foldGradient)" />

  <!-- Three horizontal lines -->
  <rect x="32" y="32" width="24" height="4" rx="2" fill="#0d9488" />
  <rect x="32" y="42" width="30" height="4" rx="2" fill="#0d9488" />
  <rect x="32" y="52" width="18" height="4" rx="2" fill="#0d9488" />

  <!-- Dollar symbol $ -->
  <text x="36" y="70" fill="#0d9488" font-family="system-ui, sans-serif" font-weight="900" font-size="18" text-anchor="middle">$</text>

  <!-- Q Tail -->
  <g transform="translate(48, 52) rotate(-45)">
    <rect x="-8" y="0" width="16" height="40" rx="3" fill="url(#brandGradient)" filter="url(#shadow1)" />
  </g>
</svg>
