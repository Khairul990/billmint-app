name: BillQyro Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android version name'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build production web bundle
        run: npm run build:android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/BillQyro-${{ github.event.inputs.version_name || github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillQyro-Android-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release asset for tagged builds
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.apk
