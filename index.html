    <script>
      window.addEventListener('error', function(e) {
        const div = document.createElement('div');
        div.style = 'position:fixed;top:0;left:0;z-index:999999;background:red;color:white;padding:20px;width:100%;font-size:16px;font-family:monospace;white-space:pre-wrap;overflow:auto;height:100vh;';
        div.innerText = 'CRASH: ' + e.message + '\n\n' + (e.error ? e.error.stack : '');
        document.body.appendChild(div);
      });
    </script>

    <!-- Prevent white flash on load for dark/rose modes -->
    <script>
      (function() {
        try {
          var userTheme = localStorage.getItem('billqyro_theme_color');
          var userMode = localStorage.getItem('billqyro_dark_mode');
          
          var adminTheme = localStorage.getItem('billqyro_admin_default_theme');
          var adminMode = localStorage.getItem('billqyro_admin_default_mode');
          
          var activeTheme = userTheme || adminTheme || 'sapphire-noir';
          // legacy guard — mode values are not themes
          if (activeTheme === 'light' || activeTheme === 'dark' || activeTheme === 'auto' || activeTheme === 'classic') activeTheme = 'sapphire-noir';
          var isDark = userMode !== null ? userMode === 'true' : (adminMode === 'dark');
          
          document.documentElement.setAttribute('data-theme', activeTheme);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var themeFolderMap = {
            classic: 'billqyro-classic',
            'brand-premium': 'billqyro-classic',
            'obsidian-gold': 'champagne-black',
            'midnight-emerald': 'emerald-business',
            'emerald-royal': 'emerald-business',
            'sapphire-noir': 'midnight-blue',
            'midnight-blue': 'midnight-blue',
            'midnight-ruby': 'ruby-burgundy',
            'rose-platinum': 'rose-gold-luxe',
            'carbon-violet': 'royal-indigo',
            'royal-purple': 'royal-indigo',
            'arctic-teal': 'billqyro-classic',
            'pink': 'pink-premium',
            emerald: 'emerald-business',
            indigo: 'royal-indigo',
            rose: 'rose-gold-luxe',
            midnight: 'midnight-blue',
            ruby: 'ruby-burgundy',
            champagne: 'champagne-black',
            'warm-amber': 'champagne-black',
            'forest-pine': 'emerald-business',
            'glacier-ice': 'midnight-blue',
            'violet-noir': 'royal-indigo',
            'magenta-pulse': 'pink-premium',
            'deep-space': 'midnight-blue',
            'olive-grove': 'emerald-business',
            'slate-graphite': 'billqyro-classic',
            'wine-cellar': 'ruby-burgundy',
            'peach-cream': 'champagne-black',
            'lagoon-mint': 'emerald-business',
            'storm-cloud': 'midnight-blue',
            'royal-navy': 'midnight-blue'
          };
          
          var folder = themeFolderMap[activeTheme] || 'billqyro-classic';
          if (folder) {
            var f32 = document.getElementById('favicon-32');
            if (f32) f32.href = '/icons/themes/' + folder + '/favicon-32x32.png';
            
            var f16 = document.getElementById('favicon-16');
            if (f16) f16.href = '/icons/themes/' + folder + '/favicon-16x16.png';
            
            var aIcon = document.getElementById('apple-touch-icon');
            if (aIcon) aIcon.href = '/icons/themes/' + folder + '/apple-touch-icon.png';
            
            var fIco = document.getElementById('favicon-ico');
            if (fIco) fIco.href = '/icons/themes/' + folder + '/favicon.ico';
            
            var dynamicManifest = {
              name: 'BillQyro — Smart Billing & Invoices',
              short_name: 'BillQyro',
              description: 'Smart billing, premium invoices, customer & payment management for growing businesses.',
              id: '/',
              theme_color: '#04100C',
              background_color: '#04100C',
              display: 'standalone',
              orientation: 'portrait-primary',
              lang: 'en',
              dir: 'ltr',
              categories: ['business', 'finance', 'productivity'],
              start_url: '/',
              scope: '/',
              shortcuts: [
                { name: 'New Invoice', short_name: 'Invoice', url: '/?qy=create-invoice', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] },
                { name: 'Customers', url: '/?qy=customers', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] },
                { name: 'Due Ledger', url: '/?qy=due-ledger', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] },
                { name: 'Reports', url: '/?qy=reports', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] }
              ],
              screenshots: [
                { src: '/dashboard-preview.png', sizes: '1024x640', type: 'image/png', form_factor: 'wide', label: 'BillQyro Dashboard' },
                { src: '/dashboard-mobile.png', sizes: '768x1376', type: 'image/png', form_factor: 'narrow', label: 'BillQyro Mobile Dashboard' }
              ],
              icons: [
                { src: '/icons/themes/' + folder + '/icon-192x192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
                { src: '/icons/themes/' + folder + '/icon-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
                { src: '/icons/themes/' + folder + '/icon-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
              ]
            };
            var manifestStr = JSON.stringify(dynamicManifest);
            var manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestStr);
            
            window.addEventListener('DOMContentLoaded', function() {
              var mLink = document.querySelector('link[rel="manifest"]');
              if (mLink) {
                 mLink.href = manifestDataUrl;
              } else {
                 mLink = document.createElement('link');
                 mLink.rel = 'manifest';
                 mLink.href = manifestDataUrl;
                 document.head.appendChild(mLink);
              }
            });
          }
        } catch (e) {}
      })();
    </script>

  <body class="transition-colors duration-300">
    
    <!-- ═══ BillQyro Boot Splash (premium first-paint animation) ═══ -->
    <div id="bq-boot" aria-hidden="true">
      <div class="bq-boot-inner">
        <div class="bq-boot-mark">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" stroke="#34D399" stroke-width="1.6" rx="3"/>
            <path d="M9 7.5h6M9 11h6M9 14.5h3.5" stroke="#34D399" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="bq-boot-ring"></span>
        </div>
        <div class="bq-boot-word">Bill<span>Qyro</span></div>
        <div class="bq-boot-tag">Smart billing · Premium control</div>
        <div class="bq-boot-bar"><i></i></div>
      </div>
    </div>
    <style>
      #bq-boot{position:fixed;inset:0;z-index:99999;background:#04100C;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s;}
      #bq-boot.bq-boot-hide{opacity:0;visibility:hidden;pointer-events:none;}
      .bq-boot-inner{display:flex;flex-direction:column;align-items:center;gap:10px;animation:bqBootIn .7s cubic-bezier(.22,1,.36,1) both;}
      .bq-boot-mark{position:relative;width:74px;height:74px;display:flex;align-items:center;justify-content:center;border-radius:22px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);}
      .bq-boot-ring{position:absolute;inset:-7px;border-radius:26px;border:2px solid rgba(52,211,153,.35);animation:bqRing 1.8s ease-out infinite;}
      .bq-boot-word{font-family:'Space Grotesk','Inter',system-ui,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;color:#F3FBF7;}
      .bq-boot-word span{background:linear-gradient(90deg,#34D399,#0DA678);-webkit-background-clip:text;background-clip:text;color:transparent;}
      .bq-boot-tag{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,251,247,.45);}
      .bq-boot-bar{width:132px;height:3px;border-radius:99px;background:rgba(52,211,153,.15);overflow:hidden;margin-top:8px;}
      .bq-boot-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#0DA678,#34D399);animation:bqBar 1.15s ease-in-out infinite;}
      @keyframes bqBootIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
      @keyframes bqRing{0%{transform:scale(.94);opacity:.9;}70%{transform:scale(1.12);opacity:0;}100%{transform:scale(1.12);opacity:0;}}
      @keyframes bqBar{0%{transform:translateX(-110%);}100%{transform:translateX(340%);}}
      @media (prefers-reduced-motion:reduce){#bq-boot .bq-boot-inner,.bq-boot-ring,.bq-boot-bar i{animation:none;}}
    </style>
    <script>
      (function(){
        var boot=document.getElementById('bq-boot');
        function hideBoot(){ if(!boot||boot.classList.contains('bq-boot-hide'))return; boot.classList.add('bq-boot-hide');
          setTimeout(function(){ if(boot&&boot.parentNode)boot.parentNode.removeChild(boot); },600); }
        if(document.readyState==='complete'){ setTimeout(hideBoot,650); }
        else{ window.addEventListener('load',function(){ setTimeout(hideBoot,650); });
          setTimeout(hideBoot,3500); /* failsafe: never trap the user */ }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
