<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-v2.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO Optimization Meta Tags -->
    <title>BillQyro - Smart Billing. Premium Invoices.</title>
    <meta name="description" content="Manage transactions, register CRM customer databases, configure product catalogs, and generate or print high-fidelity A4-format PDFs instantly with BillQyro." />
    <meta name="author" content="BillQyro Technologies" />
    
    <!-- Open Graph Metadata for Social Media Previews -->
    <meta property="og:title" content="BillQyro - Smart Billing. Premium Invoices." />
    <meta property="og:description" content="Generate professional business invoices instantly. Secure, beautiful, mobile-friendly finance dashboard for modern freelancers and businesses." />
    <meta property="og:type" content="website" />

    <!-- Prevent white flash on load for dark mode -->
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('billqyro_theme');
          if (localTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#070c18';
          } else {
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#070c18] transition-colors duration-300">
    <div id="root">
      <!-- BillQyro Native Splash Screen -->
      <style>
        .splash-container {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #f8fafc;
          z-index: 9999;
          transition: opacity 0.5s ease-out;
        }
        html.dark .splash-container {
          background-color: #070c18;
        }
        .splash-logo {
          width: 80px;
          height: 80px;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .splash-text {
          margin-top: 1.5rem;
          font-family: 'Inter', system-ui, sans-serif;
          font-size: 1.5rem;
          font-weight: 900;
          letter-spacing: -0.025em;
          color: #0f172a;
        }
        html.dark .splash-text {
          color: #ffffff;
        }
        .splash-text-qyro {
          color: #10b981;
        }
        .splash-subtitle {
          margin-top: 0.5rem;
          font-family: 'Inter', system-ui, sans-serif;
          font-size: 0.65rem;
          font-weight: 900;
          letter-spacing: 0.15em;
          color: #64748b;
          text-transform: uppercase;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: .7; transform: scale(0.95); }
        }
      </style>
      <div class="splash-container">
        <img src="/logo.svg" alt="BillQyro" class="splash-logo" />
        <div class="splash-text">Bill<span class="splash-text-qyro">Qyro</span></div>
        <div class="splash-subtitle">Loading Platform...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
