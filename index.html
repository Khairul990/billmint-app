      window.addEventListener('error', function(e) {
        const div = document.createElement('div');
        div.style = 'position:fixed;top:0;left:0;z-index:999999;background:red;color:white;padding:20px;width:100%;font-size:16px;font-family:monospace;white-space:pre-wrap;overflow:auto;height:100vh;';
        div.innerText = 'CRASH: ' + e.message + '\n\n' + (e.error ? e.error.stack : '');
        (document.body || document.documentElement).appendChild(div);
      });
    </script>

    <!-- Prevent white flash on load for dark/rose modes -->
    <script>
      (function() {
        try {
          var userTheme = localStorage.getItem('billqyro_theme_color');
          var userMode = localStorage.getItem('billqyro_dark_mode');
          
          var adminTheme = localStorage.getItem('billqyro_admin_default_theme');
          var adminMode = localStorage.getItem('billqyro_admin_default_mode');
          
          // App shell (APK / installed PWA) gets its own signature look: emerald-royal.
          // Website visitors keep sapphire-noir. An explicit user/admin theme choice
          // always wins — theme switching stays fully functional in both.
          // Strong install signals (TWA referrer / standalone) define the app
          // shell on every launch; an app link (?source=app) is session-only,
          // and stale flags from older builds are cleaned up so the marketing
          // landing (with the APK download) always shows in normal browsers.
          var strongShell = /^android-app:/.test(document.referrer || '')
            || window.matchMedia('(display-mode: standalone)').matches;
          var appShell = strongShell
            || new URLSearchParams(location.search).get('source') === 'app'
            || (function() { try { return sessionStorage.getItem('billqyro_app_shell_session') === '1'; } catch (e) { return false; } })();
          try { localStorage.removeItem('billqyro_app_shell'); } catch (e) {}
          var activeTheme = userTheme || adminTheme || (appShell ? 'emerald-royal' : 'sapphire-noir');
          // legacy guard — mode values are not themes
          if (activeTheme === 'light' || activeTheme === 'dark' || activeTheme === 'auto' || activeTheme === 'classic') activeTheme = 'sapphire-noir';
          var isDark = userMode !== null ? userMode === 'true' : (adminMode === 'dark');
          
          document.documentElement.setAttribute('data-theme', activeTheme);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }


          var THEME_MAP = {
            'sapphire-noir': { accent: '#2563EB', darkAccent: '#4F8EF7', bg: '#EEF4FF', darkBg: '#0B1118', grad: 'linear-gradient(135deg, #2563EB, #1E3A8A)' },
            'emerald-royal': { accent: '#0B8F78', darkAccent: '#10B981', bg: '#F0FDF4', darkBg: '#0B1613', grad: 'linear-gradient(135deg, #0B8F78, #056152)' },
            'brand-premium': { accent: '#0B8F78', darkAccent: '#10B981', bg: '#F4FBF9', darkBg: '#0D1714', grad: 'linear-gradient(135deg, #0B8F78, #056152)' },
            'obsidian-gold': { accent: '#D97706', darkAccent: '#F59E0B', bg: '#FFFBEB', darkBg: '#0F0F11', grad: 'linear-gradient(135deg, #D97706, #B45309)' },
            'rose-platinum': { accent: '#E11D48', darkAccent: '#FB7185', bg: '#FFF1F2', darkBg: '#180D11', grad: 'linear-gradient(135deg, #E11D48, #BE123C)' },
            'graphite-copper': { accent: '#EA580C', darkAccent: '#FB923C', bg: '#FFF7ED', darkBg: '#16110F', grad: 'linear-gradient(135deg, #EA580C, #C2410C)' },
            'midnight-ruby': { accent: '#DC2626', darkAccent: '#F87171', bg: '#FEF2F2', darkBg: '#180B0B', grad: 'linear-gradient(135deg, #DC2626, #B91C1C)' },
            'ocean-waves': { accent: '#0284C7', darkAccent: '#38BDF8', bg: '#F0F9FF', darkBg: '#08141F', grad: 'linear-gradient(135deg, #0284C7, #0369A1)' },
            'sunset-orange': { accent: '#F97316', darkAccent: '#FB923C', bg: '#FFF7ED', darkBg: '#18110B', grad: 'linear-gradient(135deg, #F97316, #EA580C)' },
            'royal-purple': { accent: '#9333EA', darkAccent: '#C084FC', bg: '#FAF5FF', darkBg: '#140B1A', grad: 'linear-gradient(135deg, #9333EA, #7E22CE)' },
            'cyber-teal': { accent: '#0D9488', darkAccent: '#2DD4BF', bg: '#F0FDFA', darkBg: '#0B1616', grad: 'linear-gradient(135deg, #0D9488, #0F766E)' },
            'gold-coast': { accent: '#CA8A04', darkAccent: '#FACC15', bg: '#FEFCE8', darkBg: '#161408', grad: 'linear-gradient(135deg, #CA8A04, #A16207)' },
            'crimson-red': { accent: '#E11D48', darkAccent: '#F43F5E', bg: '#FFF1F2', darkBg: '#180B0F', grad: 'linear-gradient(135deg, #E11D48, #BE123C)' },
            'cherry-blossom': { accent: '#DB2777', darkAccent: '#F472B6', bg: '#FDF2F8', darkBg: '#180B13', grad: 'linear-gradient(135deg, #DB2777, #BE185D)' },
            'obsidian-black': { accent: '#64748B', darkAccent: '#94A3B8', bg: '#F8FAFC', darkBg: '#090D14', grad: 'linear-gradient(135deg, #475569, #1E293B)' }
          };
          var tData = THEME_MAP[activeTheme] || THEME_MAP['sapphire-noir'];
          var customBrand = localStorage.getItem('billqyro_brand_color');
          var curAccent = (customBrand && activeTheme === 'custom') ? customBrand : (isDark ? tData.darkAccent : tData.accent);
          var curBg = isDark ? tData.darkBg : tData.bg;
          var curText = isDark ? '#F9FAFB' : '#0F172A';
          var curGrad = (customBrand && activeTheme === 'custom') ? ('linear-gradient(135deg, ' + customBrand + ', #1E3A8A)') : tData.grad;

          document.documentElement.style.setProperty('--splash-bg', curBg);
          document.documentElement.style.setProperty('--splash-text', curText);
          document.documentElement.style.setProperty('--splash-accent', curAccent);
          document.documentElement.style.setProperty('--splash-accent-grad', curGrad);
          document.documentElement.style.setProperty('--splash-ring', isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)');
          document.documentElement.style.setProperty('--splash-glow', isDark ? 'rgba(0,0,0,0.5)' : 'rgba(37,99,235,0.25)');

          var themeFolderMap = {
            classic: 'billqyro-classic',
            'brand-premium': 'billqyro-classic',
            'obsidian-gold': 'champagne-black',
            'midnight-emerald': 'emerald-business',
            'emerald-royal': 'emerald-business',
            'sapphire-noir': 'midnight-blue',
            'midnight-blue': 'midnight-blue',
            'midnight-ruby': 'ruby-burgundy',
            'rose-platinum': 'rose-gold-luxe',
            'carbon-violet': 'royal-indigo',
            'royal-purple': 'royal-indigo',
            'arctic-teal': 'billqyro-classic',
            'pink': 'pink-premium',
            emerald: 'emerald-business',
            indigo: 'royal-indigo',
            rose: 'rose-gold-luxe',
            midnight: 'midnight-blue',
            ruby: 'ruby-burgundy',
            champagne: 'champagne-black',
            'warm-amber': 'champagne-black',
            'forest-pine': 'emerald-business',
            'glacier-ice': 'midnight-blue',
            'violet-noir': 'royal-indigo',
            'magenta-pulse': 'pink-premium',
            'deep-space': 'midnight-blue',
            'olive-grove': 'emerald-business',
            'slate-graphite': 'billqyro-classic',
                'lagoon-mint': 'emerald-business',
            'storm-cloud': 'midnight-blue',
            'royal-navy': 'midnight-blue'
          };
          
          var folder = themeFolderMap[activeTheme] || 'billqyro-classic';
          if (folder) {
            var f32 = document.getElementById('favicon-32');
            if (f32) f32.href = '/icons/themes/' + folder + '/favicon-32x32.png';
            
            var f16 = document.getElementById('favicon-16');
            if (f16) f16.href = '/icons/themes/' + folder + '/favicon-16x16.png';
            
            var aIcon = document.getElementById('apple-touch-icon');
            if (aIcon) aIcon.href = '/icons/themes/' + folder + '/apple-touch-icon.png';
            
            var fIco = document.getElementById('favicon-ico');
            if (fIco) fIco.href = '/icons/themes/' + folder + '/favicon.ico';
            
            var dynamicManifest = {
              name: 'BillQyro — Smart Billing & Invoices',
              short_name: 'BillQyro',
              description: 'Smart billing, premium invoices, customer & payment management for growing businesses.',
              id: '/',
              theme_color: '#FFFFFF',
              background_color: '#FFFFFF',
              display: 'standalone',
              orientation: 'portrait-primary',
              lang: 'en',
              dir: 'ltr',
              categories: ['business', 'finance', 'productivity'],
              start_url: '/',
              scope: '/',
              shortcuts: [
                { name: 'New Invoice', short_name: 'Invoice', url: '/?qy=create-invoice', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] },
                { name: 'Customers', url: '/?qy=customers', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] },
                { name: 'Due Ledger', url: '/?qy=due-ledger', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] },
                { name: 'Reports', url: '/?qy=reports', icons: [{ src: '/icon-192x192.png', sizes: '192x192', type: 'image/png' }] }
              ],
              screenshots: [
                { src: '/dashboard-preview.png', sizes: '1024x640', type: 'image/png', form_factor: 'wide', label: 'BillQyro Dashboard' },
                { src: '/dashboard-mobile.png', sizes: '768x1376', type: 'image/png', form_factor: 'narrow', label: 'BillQyro Mobile Dashboard' }
              ],
              icons: [
                { src: '/icons/themes/' + folder + '/icon-192x192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
                { src: '/icons/themes/' + folder + '/icon-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
                { src: '/icons/themes/' + folder + '/icon-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
              ]
            };
            var manifestStr = JSON.stringify(dynamicManifest);
            var manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestStr);
            
            window.addEventListener('DOMContentLoaded', function() {
              var mLink = document.querySelector('link[rel="manifest"]');
              if (mLink) {
                 mLink.href = manifestDataUrl;
              } else {
                 mLink = document.createElement('link');
                 mLink.rel = 'manifest';
                 mLink.href = manifestDataUrl;
                 document.head.appendChild(mLink);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
  
    <style id="splash-styles">
      #bq-initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg, #EEF4FF);
        color: var(--splash-text, #0F172A);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: background-color 0.2s ease;
      }
      #bq-initial-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--splash-accent-grad, linear-gradient(135deg, #2563EB, #1E3A8A));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px var(--splash-glow, rgba(37, 99, 235, 0.25));
      }
      #bq-initial-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--splash-ring, rgba(0, 0, 0, 0.08));
        border-top-color: var(--splash-accent, #2563EB);
        border-radius: 50%;
        animation: bq_spin 0.8s linear infinite;
      }
      @keyframes bq_spin { to { transform: rotate(360deg); } }
    </style>
  </head>

              <line x1="16" y1="13" x2="8" y2="13"></line>
